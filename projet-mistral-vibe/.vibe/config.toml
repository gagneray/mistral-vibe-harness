# Configuration projet Mistral Vibe 2.26.0 (prise en compte une fois le dossier approuvé).
# Clés de premier niveau d'abord : toute clé placée après une table lui appartiendrait.

# Agent au lancement interactif : l'agent intégré "plan" (lecture seule, plan à valider).
default_agent = "plan"

# GLM 5.3 (D-12) : alias déclaré dans l'entrée [[models]] en fin de fichier.
# Repli : active_model = "mistral-medium-3.5" (alias intégré), ici et dans agents/orchestrator.toml.
active_model = "glm-5-3"

# Pas d'enabled_skills : une liste blanche masquerait aussi les skills fournies par Vibe.
# Pas de sensitive_patterns : la définir remplacerait les motifs .env* protégés par défaut.

# Modèle de compaction du contexte : Small 4, sans réflexion, même provider que le modèle actif.
[compaction_model]
name = "mistral-small-latest"
provider = "mistral"
alias = "small-compact"
temperature = 0.2
thinking = "off"

# Clés historiques [tools.bash] / [tools.edit] / [tools.write_file] : en 2.26.0 (Unified Harness),
# elles s'appliquent à file_system.bash et process.*, file_system.search_replace, file_system.write_file
# (vibe/app_server/_unified_permissions.py).
#
# Shell : préfixes refusés sans demande.
# Définir une liste remplace celle par défaut (fusion superficielle, vibe/core/tools/manager.py) :
# la denylist reprend donc les défauts POSIX de bash.py ; pas d'allowlist (git status/diff/log y sont déjà).
# Comparaison par préfixe : protection partielle (ex. "git push origin x --force" passe).
[tools.bash]
denylist = ["gdb", "pdb", "passwd", "nano", "vim", "vi", "emacs", "bash -i", "sh -i", "zsh -i", "fish -i", "dash -i", "screen", "tmux", "git push --force", "git push -f", "rm -rf", "rm -fr"]

# Le harnais (.vibe/) est protégé en écriture pour les agents, élément par élément :
# un motif global "*/.vibe/*" couvrirait aussi ~/.vibe/plans/ et empêcherait l'agent plan d'écrire son plan.
[tools.edit]
denylist = ["*/.vibe/agents/*", "*/.vibe/prompts/*", "*/.vibe/hooks/*", "*/.vibe/skills/*", "*/.vibe/logs/*", "*/.vibe/config.toml", "*/.vibe/hooks.toml"]

[tools.write_file]
denylist = ["*/.vibe/agents/*", "*/.vibe/prompts/*", "*/.vibe/hooks/*", "*/.vibe/skills/*", "*/.vibe/logs/*", "*/.vibe/config.toml", "*/.vibe/hooks.toml"]

# GLM 5.3, hébergé par Mistral : même provider et même clé MISTRAL_API_KEY ; texte seul, contexte 1M
# (https://docs.mistral.ai/models/zai-glm-5-3). Une image est décrite par le modèle de vision de repli
# du provider, Medium 3.5, faute de vision_model défini (vibe/core/config/vibe_schema.py, get_vision_fallback_model).
# thinking : Vibe 2.26.0 envoie reasoning_effort "high" pour medium/high/max et "none" pour low
# (adapters/mistral.py du Unified Harness). L'API reçoit donc "high" ; le "max" de GLM n'est pas atteignable.
# GLM refuse "none" (https://docs.mistral.ai/capabilities/reasoning) : ne pas utiliser /thinking low.
# Prix en USD par million de tokens (entrée, sortie, entrée en cache).
[[models]]
name = "zai-glm-5-3"
provider = "mistral"
alias = "glm-5-3"
thinking = "max"
input_price = 1.4
output_price = 4.4
cached_input_price = 0.14
